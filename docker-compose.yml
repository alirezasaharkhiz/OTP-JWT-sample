version: "3.9"

services:
  app:
    build: .
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    environment:
      - POSTGRES_DSN=${POSTGRES_DSN}
      - REDIS_ADDR=${REDIS_ADDR}
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
